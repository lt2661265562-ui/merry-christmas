<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Merry Christmas</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  body { position:fixed; inset:0; -webkit-tap-highlight-color:transparent; }
  #stage {
    position:absolute; left:50%; top:50%;
    width:1600px; height:900px;
    transform-origin: center center;
    background:#000;
    overflow:hidden;
  }
  #cv { display:block; width:1600px; height:900px; }
  #txt, #sub {
    position:absolute; left:40px; color:#fff;
    font-family:"Monotype Corsiva","Snell Roundhand","Brush Script MT","Segoe Script","Palatino Linotype",Palatino,Georgia,serif;
    font-size:45px; line-height:1.15; white-space:nowrap;
    text-shadow:0 0 24px rgba(210,225,255,.75), 0 0 48px rgba(150,190,255,.35);
    pointer-events:none; user-select:none;
  }
  #txt { top:268px; font-size:56px; letter-spacing:.02em; }
  #sub { top:346px; font-size:40px; color:#e8d8ff; }
  #hint {
    position:absolute; right:24px; bottom:16px; text-align:right;
    color:rgba(190,205,235,.55); font:13px/1.4 -apple-system,"PingFang SC",sans-serif;
    letter-spacing:.08em; pointer-events:none; user-select:none;
    transition:opacity 1.2s ease; opacity:1;
  }
  #hint.gone { opacity:0; }
  #music {
    position:absolute; right:20px; top:18px; width:46px; height:46px;
    border-radius:50%; border:1px solid rgba(180,200,240,.42);
    background:rgba(12,16,30,.42); color:rgba(220,232,255,.92);
    font:20px/1 -apple-system,"PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; -webkit-user-select:none;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:background .25s, border-color .25s, transform .18s;
    z-index:10;
  }
  #music:hover { background:rgba(30,40,70,.6); border-color:rgba(210,225,255,.7); }
  #music:active { transform:scale(.92); }
  #music.on { border-color:rgba(255,215,240,.85); color:#ffd9f0;
    box-shadow:0 0 18px rgba(255,180,225,.45); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1600" height="900"></canvas>
  <div id="txt">Merry Christmas</div>
  <div id="sub"></div>
  <div id="music" title="播放/暂停音乐">♪</div>
  <div id="hint">ZekangLi-Zico / Christmas-Tree</div>
</div>
<script>
(function () {
  'use strict';

  // ================== 全局参数（对应 tree.py） ==================
  const WIDTH = 1600, HEIGHT = 900;
  const TREE_POINTS = 50000, GROUND_POINTS = 4000, STAR_POINTS = 1200,
        HEART_POINTS = 1000, SNOW2D_POINTS = 10;
  const CAM_DIST = 13, CAM_HEIGHT = 6.0, PITCH = -0.25;
  const TREE_HEIGHT = 12.0;
  const TAU = Math.PI * 2;
  const SPIN = 0.0045;             // 每帧自转增量（pygame 版固定 60fps）
  const FOCAL = HEIGHT * 0.63;
  const LAYERS_DECL = 6;

  // ================== 可改的文字 ==================
  // README 说明 "647" 是作者的个人备注，这里默认留空，自行填写即可
  const TEXT_MAIN = 'Merry Christmas';
  const TEXT_SUB  = '647';

  // 移动端降粒子密度（速度优先）
  const IS_MOBILE = Math.min(screen.width, screen.height) < 760;
  const DENSITY = IS_MOBILE ? 0.5 : 1.0;

  const rand = Math.random;
  const uniform = (a, b) => a + rand() * (b - a);
  const randint = (a, b) => a + Math.floor(rand() * (b - a + 1));
  function gauss(mu, sigma) {
    let u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  }

  // ================== 生成圣诞树 ==================
  function genTreePoints() {
    const bucket = { x: [], y: [], z: [], c: [] };
    const total = Math.round(TREE_POINTS * DENSITY);
    const loops = 9;
    const spiralN = Math.round(total * 0.7);

    // 70% 螺旋灯带
    for (let i = 0; i < spiralN; i++) {
      const u = rand();
      const h = Math.pow(u, 1.6);
      const y = TREE_HEIGHT * h + 0.2;

      let baseR = Math.pow(1 - h, 0.95) * 3.5;
      const branchWave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      baseR *= 1.0 + 0.65 * branchWave;

      const t = u * loops * TAU;
      const angle = t + uniform(-0.22, 0.22);
      const r = baseR * uniform(0.85, 1.08);

      let midBoost = 1.0 - Math.abs(h - 0.55) * 1.5;
      midBoost = Math.max(0.15, midBoost);
      const baseG = 155 + Math.floor(90 * midBoost);
      const baseB = 185 + Math.floor(70 * midBoost);

      let cr = 255,
          cg = Math.min(255, baseG + randint(-15, 20)),
          cb = Math.min(255, baseB + randint(-15, 35));
      if (rand() < 0.08) {
        cr = 255; cg = 255 - randint(0, 35); cb = Math.min(255, 230 + randint(0, 25));
      }
      bucket.x.push(Math.cos(angle) * r);
      bucket.y.push(y);
      bucket.z.push(Math.sin(angle) * r);
      bucket.c.push((cr << 16) | (cg << 8) | cb);
    }

    // 30% 随机填充
    const fillN = total - spiralN;
    for (let i = 0; i < fillN; i++) {
      const h = Math.pow(rand(), 1.9);
      const y = TREE_HEIGHT * h + 0.2 + uniform(-0.08, 0.08);

      let baseR = Math.pow(1 - h, 0.95) * 4.6;
      const branchWave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      baseR *= 1.0 + 0.65 * branchWave;

      const r = baseR * Math.sqrt(rand());
      const angle = rand() * TAU;

      const cg = randint(165, 225), cb = randint(190, 250);
      bucket.x.push(Math.cos(angle) * r + uniform(-0.08, 0.08));
      bucket.y.push(y);
      bucket.z.push(Math.sin(angle) * r + uniform(-0.08, 0.08));
      bucket.c.push((255 << 16) | (cg << 8) | cb);
    }
    return bucket;
  }

  // ================== 地面光环 ==================
  function genGroundPoints() {
    const bucket = { x: [], y: [], z: [], c: [] };
    // 俯视投影会把大半径地面推到画布外，这里只在树脚铺一层淡淡星尘基座
    const total = Math.round(GROUND_POINTS * DENSITY * 0.55);
    for (let i = 0; i < total; i++) {
      const r = 3.2 + Math.sqrt(rand()) * 2.8;
      const theta = rand() * TAU;
      const c = randint(140, 205);
      bucket.x.push(Math.cos(theta) * r);
      bucket.y.push(0.06 + uniform(-0.02, 0.02));
      bucket.z.push(Math.sin(theta) * r);
      bucket.c.push((c << 16) | (Math.min(255, c + 25) << 8) | 255);
    }
    return bucket;
  }

  // ================== 空中 3D 小亮点 ==================
  function genStarPoints() {
    const bucket = { x: [], y: [], z: [], c: [] };
    const total = Math.round(STAR_POINTS * DENSITY);
    for (let i = 0; i < total; i++) {
      const base = randint(215, 255);
      bucket.x.push(uniform(-18, 18));
      bucket.y.push(uniform(3, 18));
      bucket.z.push(uniform(-18, 18));
      bucket.c.push((base << 16) | (base << 8) | 255);
    }
    return bucket;
  }

  // ================== 树顶 3D 爱心 ==================
  function genHeartPoints() {
    const bucket = { x: [], y: [], z: [], c: [] };
    const scale = 1.15;
    const topY = TREE_HEIGHT - 0.92;
    const total = Math.round(HEART_POINTS * DENSITY);
    let made = 0, guard = 0;
    while (made < total && guard < total * 400) {
      guard++;
      const x = uniform(-1.3, 1.3);
      const y = uniform(-1.4, 1.4);
      const f = Math.pow(x * x + y * y - 1.0, 3) - x * x * (y * y * y);
      if (f <= 0.0) {
        const dist = Math.hypot(x, y);
        let factor = Math.max(0.35, 1.15 - 0.5 * dist);
        let cg = Math.trunc(130 * factor + 80);
        let cb = Math.trunc(190 * factor + 70);
        cg = Math.max(120, Math.min(255, cg));
        cb = Math.max(120, Math.min(255, cb));
        bucket.x.push(x * scale * 1.00);
        bucket.y.push(topY + (y + 1.0) * scale * 0.52);
        bucket.z.push(uniform(-0.18, 0.18));
        bucket.c.push((255 << 16) | (cg << 8) | cb);
        made++;
      }
    }
    return bucket;
  }

  // ================== 前景 2D 大雪花 ==================
  const flakes = [];
  function respawnFlake(f) {
    f.x = uniform(0, WIDTH);
    f.y = uniform(-80, -10);
    f.r = uniform(10, 16);
    f.v = uniform(30, 45);
    f.maxLife = (HEIGHT + 80 - f.y) / f.v;
    f.life = f.maxLife;
    return f;
  }
  function initSnow() {
    for (let i = 0; i < SNOW2D_POINTS; i++) flakes.push(respawnFlake({}));
  }
  function updateSnow(dt) {
    for (const f of flakes) {
      f.y += f.v * dt;
      f.life -= dt;
      if (f.life <= 0 || f.y > HEIGHT + 50) respawnFlake(f);
    }
  }

  // ================== 主程序 ==================
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d', { alpha: false });
  const stage = document.getElementById('stage');
  const elSub = document.getElementById('sub');
  const elHint = document.getElementById('hint');

  let tree, ground, stars, heart;
  const all = { x: [], y: [], z: [], c: [] };
  // 3 个深度层 × 每层 颜色/尺寸桶 -> Path2D
  const layerPaths = [], layerColor = [];
  for (let i = 0; i < LAYERS_DECL; i++) { layerPaths.push(new Map()); layerColor.push(new Map()); }

  function build() {
    tree = genTreePoints();
    ground = genGroundPoints();
    stars = genStarPoints();
    heart = genHeartPoints();
    for (const part of [tree, ground, stars, heart]) {
      for (let i = 0; i < part.x.length; i++) {
        all.x.push(part.x[i]);
        all.y.push(part.y[i]);
        all.z.push(part.z[i]);
        all.c.push(part.c[i]);
      }
    }
    initSnow();
  }

  // 屏幕坐标缓冲
  let sxBuf, syBuf, depBuf;
  function allocBuffers() {
    const n = all.x.length;
    sxBuf = new Int16Array(n);
    syBuf = new Int16Array(n);
    depBuf = new Float32Array(n);
  }

  let angle = 0, last = 0, acc = 0;
  const PITCH_COS = Math.cos(PITCH), PITCH_SIN = Math.sin(PITCH);

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.min(vw / WIDTH, vh / HEIGHT);
    // stage 始终是 1600x900 逻辑坐标，整体缩放
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
    // canvas 按设备像素比渲染，再缩放显示回 1600x900 逻辑尺寸
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const needW = Math.max(1, Math.round(WIDTH * s * dpr));
    const needH = Math.max(1, Math.round(HEIGHT * s * dpr));
    if (canvas.width !== needW || canvas.height !== needH) {
      canvas.width = needW;
      canvas.height = needH;
    }
    canvas.style.width = WIDTH + 'px';
    canvas.style.height = HEIGHT + 'px';
    ctx.setTransform(needW / WIDTH, 0, 0, needH / HEIGHT, 0, 0);
  }

  function drawFrame(dt) {
    updateSnow(dt);

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.globalCompositeOperation = 'source-over';

    const cosA = Math.cos(angle), sinA = Math.sin(angle);
    const n = all.x.length;
    const halfW = WIDTH * 0.5, halfH = HEIGHT * 0.5;

    // 1) 投影 + 屏幕裁剪
    let m = 0;
    for (let i = 0; i < n; i++) {
      const x = all.x[i], y = all.y[i], z = all.z[i];
      const xz = x * cosA - z * sinA;
      const zz = x * sinA + z * cosA;

      let yp = y * PITCH_COS - zz * PITCH_SIN;
      let zp = y * PITCH_SIN + zz * PITCH_COS;
      zp += CAM_DIST;
      yp -= CAM_HEIGHT;
      if (zp <= 0.1) continue;

      const f = FOCAL / zp;
      const px = halfW + xz * f;
      const py = halfH - yp * f;
      if (px < -6 || px > WIDTH + 6 || py < -6 || py > HEIGHT + 6) continue;

      sxBuf[m] = px; syBuf[m] = py; depBuf[m] = zp;
      m++;
    }

    // 2) 分 3 个深度层，远层先画；层内不再逐粒子排序
    //    颜色量化到 565 后按层聚合，一帧只有几十次 fill
    const LAYERS = LAYERS_DECL;
    for (let L = 0; L < LAYERS; L++) {
      layerPaths[L].clear();
      layerColor[L].clear();
    }
    for (let i = 0; i < m; i++) {
      const zp = depBuf[i];
      // zp 大致落在 [7, 19]，切成 3 层
      let L = Math.floor((zp - 6.0) / 2.4);
      if (L < 0) L = 0; else if (L > LAYERS - 1) L = LAYERS - 1;
      L = LAYERS - 1 - L;                       // 远处先画
      const size = zp > 18 ? 1 : (zp > 14 ? 1.4 : (zp > 11 ? 2 : 2.6));
      const c = all.c[i];
      // 均匀 4/4/4 量化，保住色相
      const q = ((c >> 20) & 0xF) << 8 | ((c >> 12) & 0xF) << 4 | ((c >> 4) & 0xF);
      const key = (q << 2) | (size - 1);
      let pth = layerPaths[L].get(key);
      if (!pth) {
        pth = new Path2D();
        layerPaths[L].set(key, pth);
        layerColor[L].set(key, [q, size]);
      }
      const px = sxBuf[i], py = syBuf[i];
      pth.moveTo(px + size, py);
      pth.arc(px, py, size, 0, TAU);
    }

    // 3) 逐层逐色 fill
    for (let L = 0; L < LAYERS; L++) {
      layerPaths[L].forEach(function (pth, key) {
        const meta = layerColor[L].get(key);
        const q = meta[0];
        const r = (((q >> 8) & 0xF) * 17);
        const g = (((q >> 4) & 0xF) * 17);
        const bl = ((q & 0xF) * 17);
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + bl + ')';
        ctx.fill(pth);
      });
    }

    // 5) 前景大雪花（叠加发光）
    ctx.globalCompositeOperation = 'lighter';
    for (const f of flakes) {
      if (f.maxLife <= 0) continue;
      const phase = f.life / f.maxLife;
      const alpha = phase > 0.3 ? 1 : Math.max(0, phase / 0.3);
      const cx = f.x, cy = f.y;
      const radii = [f.r * 1.3, f.r * 1.0, f.r * 0.75, f.r * 0.55, f.r * 0.45];
      const alphas = [alpha / 20, alpha / 12, alpha / 6, alpha / 3, alpha];
      for (let s = 0; s < 5; s++) {
        const a = alphas[s];
        if (a <= 0.002) continue;
        ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(1, radii[s]), 0, TAU);
        ctx.fill();
      }
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  function loop(now) {
    const t = now / 1000;
    if (!last) last = t;
    let dt = t - last;
    last = t;
    if (dt > 0.1) dt = 0.1;       // 切标签页回来不要跳帧
    if (dt < 0) dt = 0;

    drawFrame(dt);
    angle += SPIN * (dt * 60);    // 与 pygame 的 60fps 步进等价
    if (angle > TAU * 1000) angle -= TAU * 1000;
    requestAnimationFrame(loop);
  }

  // ================== 启动 ==================
  document.getElementById('txt').textContent = TEXT_MAIN;
  elSub.textContent = TEXT_SUB;
  if (!TEXT_SUB) elSub.style.display = 'none';

  build();
  allocBuffers();
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  // 轻触切换提示条
  let tapped = false;
  document.addEventListener('touchstart', function () {
    if (tapped) return;
    tapped = true;
    elHint.classList.add('gone');
  }, { passive: true });
  setTimeout(function () { elHint.classList.add('gone'); }, 6000);

  requestAnimationFrame(loop);

  // 调试接口

  audio.loop = true;
  audio.preload = 'auto';
  audio.volume = 0.0;

  const btn = document.getElementById('music');
  let musicOn = false, fadeTimer = null, wantOn = false;

  function fadeVolume(target, ms) {
    if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
    const start = audio.volume, t0 = performance.now();
    audio.volume = Math.max(0, Math.min(1, start));
    fadeTimer = setInterval(function () {
      const k = Math.min(1, (performance.now() - t0) / ms);
      const v = start + (target - start) * k;
      audio.volume = Math.max(0, Math.min(1, v));
      if (k >= 1) { clearInterval(fadeTimer); fadeTimer = null; }
    }, 40);
  }

  function playMusic() {
    wantOn = true;
    audio.volume = 0;
    const p = audio.play();
    if (p && typeof p.then === 'function') {
      p.then(function () {
        musicOn = true;
        wantOn = true;
        btn.classList.add('on');
        btn.textContent = '\u266B';
        audio.volume = 0;
        fadeVolume(0.62, 1600);
      }).catch(function () {
        musicOn = false;
        wantOn = false;
        btn.classList.remove('on');
        btn.textContent = '\u266A';
      });
    }
  }

  function pauseMusic() {
    wantOn = false;
    musicOn = false;
    btn.classList.remove('on');
    btn.textContent = '\u266A';
    fadeVolume(0, 420);
    setTimeout(function () { if (!wantOn) audio.pause(); }, 470);
  }

  function toggleMusic() { if (wantOn) pauseMusic(); else playMusic(); }
  if (btn) btn.addEventListener('click', toggleMusic);

  function autoStart() {
    if (!wantOn) playMusic();
    document.removeEventListener('touchstart', autoStart);
    document.removeEventListener('mousedown', autoStart);
    document.removeEventListener('keydown', autoStart);
  }
  document.addEventListener('touchstart', autoStart, { passive: true });
  document.addEventListener('mousedown', autoStart);
  document.addEventListener('keydown', autoStart);
  setTimeout(function () { if (!wantOn) playMusic(); }, 700);

  window.__tree = {
    audio: audio, music: function () { return { on: musicOn, vol: audio.volume, t: audio.currentTime, paused: audio.paused, dur: audio.duration, err: audio.error && audio.error.code }; },
    toggle: toggleMusic,
    get points() { return all.x.length; },
    get angle() { return angle; },
    reset: function () { angle = 0; },
    probe: function (n) { drawFrame(1 / 60, n || 10); },
    // 静帧采样：返回若干像素的 RGB，便于无渲染环境核对
    sample: function (angleOverride) {
      if (typeof angleOverride === 'number') angle = angleOverride;
      drawFrame(0);
      const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let lit = 0, sr = 0, sg = 0, sb = 0, maxv = 0;
      for (let i = 0; i < d.length; i += 4 * 53) {
        const v = d[i] + d[i + 1] + d[i + 2];
        if (v > 16) { lit++; sr += d[i]; sg += d[i + 1]; sb += d[i + 2]; if (v > maxv) maxv = v; }
      }
      return { lit: lit, avgR: Math.round(sr / (lit || 1)), avgG: Math.round(sg / (lit || 1)),
               avgB: Math.round(sb / (lit || 1)), maxv: maxv, w: canvas.width, h: canvas.height };
    }
  };
})();
